name: Testes e Integracao Continua (CI)

on:
  push:
    branches:
      - projeto-integrador-dois
      - main
  pull_request:
    branches:
      - projeto-integrador-dois
      - main

jobs:
  test:
    name: Executar Testes Automatizados (Django)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Executar Bateria de Testes (SQLite em Memoria)
        run: |
          python backend/manage.py test tests --settings=config.test_settings
