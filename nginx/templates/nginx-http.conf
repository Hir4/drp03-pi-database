upstream django_backend {
    server backend:8000;
}

limit_req_zone $binary_remote_addr zone=req_limit:10m rate=15r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    # Cabecalhos de seguranca
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compressao Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        image/svg+xml;

    # Desafio ACME para emissao de certificado SSL gratuito Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Arquivos Estaticos coletados via collectstatic
    location /static/ {
        alias /var/www/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Proxy reverso para o Gunicorn / Django
    location / {
        limit_req zone=req_limit burst=30 nodelay;

        proxy_pass http://django_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
